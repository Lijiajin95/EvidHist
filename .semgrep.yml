rules:
  - id: evidhist-no-shell-execution
    message: Use an argument list with shell=False; downloaded text must never become shell code.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: subprocess.$METHOD(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
  - id: evidhist-no-dynamic-python-execution
    message: Treat source documents and model outputs as data, not executable Python.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: evidhist-no-unsafe-deserialization
    message: Untrusted artifacts require a safe, explicitly validated serialization format.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.unsafe_load(...)
  - id: evidhist-keep-tls-verification
    message: Keep TLS certificate verification enabled for source and model requests.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: httpx2.$METHOD(..., verify=False, ...)

