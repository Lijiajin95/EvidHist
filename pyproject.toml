[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evidhist"
version = "0.0.1"
description = "Personal open-source product for Chinese historical evidence reliability"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.34,<1",
  "langgraph>=1.2.16,<2",
  "httpx2>=2.13,<3",
]

[project.scripts]
evidhist-eval-quotes = "evidhist.evaluation:main"

[dependency-groups]
dev = [
  "uv==0.12.24",
  "hypothesis>=6.125,<7",
  "pre-commit>=4.4,<5",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.14,<1",
  "pytest-timeout>=2.4,<3",
  "pylint>=4.1,<5",
  "import-linter>=2.15,<3",
  "deptry>=0.25,<1",
  "certifi>=2026.7.22,<2027",
  "diff-cover>=9,<10",
]
mutation = ["mutmut>=3.8,<4"]
security = [
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/evidhist"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["mutants", ".cache"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C901",
  "PLR0912",
  "PLR0913",
]
allowed-confusables = ["，", "：", "；", "。", "（", "）"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom puts Depends(...) in parameter defaults.
"src/evidhist/api*.py" = ["B008"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["mutants", ".cache", ".venv"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
strict = ["src/evidhist"]
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
timeout_method = "signal"
markers = [
  "integration: requires the isolated PostgreSQL test database",
  "system: requires a running service and the test database",
  "scenario: deterministic multi-step workflow behavior",
  "llm_live: paid or external live model evaluation (explicit opt-in)",
  "ui: real browser UI tests (enabled when a product screen exists)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["evidhist"]
omit = ["src/evidhist/__init__.py", "src/evidhist/domain/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.mutmut]
source_paths = ["src/evidhist/"]
only_mutate = ["src/evidhist/domain/citations.py", "src/evidhist/domain/materials.py"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/property/"]
pytest_add_cli_args = ["--import-mode=importlib", "-o", "addopts="]
also_copy = ["tests", "evals", "config", "scripts", "contracts"]

[tool.pylint.main]
disable = ["all"]
enable = ["too-many-public-methods", "too-many-lines"]
ignore-paths = ["mutants", "^\\.cache/", "^\\.venv/"]

[tool.pylint.design]
max-public-methods = 20

[tool.pylint.format]
max-module-lines = 500

[tool.importlinter]
root_package = "evidhist"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain must not depend on API or database adapters"
type = "forbidden"
source_modules = ["evidhist.domain"]
forbidden_modules = ["evidhist.api", "evidhist.database", "fastapi", "sqlalchemy"]
allow_indirect_imports = false

[tool.deptry]
extend_exclude = ["mutants", "\\.cache", "\\.toolchain", "\\.venv"]
known_first_party = ["evidhist", "structure_metrics"]

[tool.deptry.per_rule_ignores]
# uvicorn is the ASGI server entry used by `make run` (evidhist.api:app), not an import.
# psycopg is referenced through the SQLAlchemy DSN scheme `postgresql+psycopg://`.
DEP002 = ["uvicorn", "psycopg"]

[tool.bandit]
# 工程脚本按字面量参数调用项目工具（uv/pytest/psql 等），不接受外部输入；这三项只反映
# "用到了 subprocess / 相对可执行路径"，无法区分安全用法，故显式豁免。真正的危险形态
# （shell=True、os.system、eval/exec、pickle、关闭 TLS 校验）仍由 B602/B604/B605/B307/
# B102/B301/B506/B501 拦截，见 tests/unit/test_security_scan.py 的植入负例。
skips = ["B404", "B603", "B607"]
